name: App Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      # family link: the server address and the Firebase file for push messages, when they have been set up
      - name: Family link settings
        env:
          FAMILIA_API_URL: ${{ vars.FAMILIA_API_URL }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$FAMILIA_API_URL" ] && [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '{"url":"%s"}' "$FAMILIA_API_URL" > familia.json
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "family link on"
          else
            echo "family link off (FAMILIA_API_URL / GOOGLE_SERVICES_JSON not set)"
          fi
      - run: npm run sync
      - name: Build APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug bundleRelease --no-daemon
      - run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk PautApp.apk
          cp android/app/build/outputs/bundle/release/app-release.aab PautApp-play.aab
      - uses: actions/upload-artifact@v4
        with:
          name: PautApp-apk
          path: |
            PautApp.apk
            PautApp-play.aab
      - name: Publish download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima PautApp.apk PautApp-play.aab --title "PautApp (última versión)" --notes "Abre este enlace desde el móvil Android y toca PautApp.apk para instalar. PautApp-play.aab es el archivo para subir a Google Play."
