name: App Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run sync
      - name: Build APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug bundleRelease --no-daemon
      - run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk MiPauta.apk
          cp android/app/build/outputs/bundle/release/app-release.aab MiPauta-play.aab
      - uses: actions/upload-artifact@v4
        with:
          name: MiPauta-apk
          path: |
            MiPauta.apk
            MiPauta-play.aab
      - name: Publish download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima MiPauta.apk MiPauta-play.aab --title "MiPauta (última versión)" --notes "Abre este enlace desde el móvil Android y toca MiPauta.apk para instalar. MiPauta-play.aab es el archivo para subir a Google Play."
