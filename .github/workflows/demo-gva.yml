name: App Android (demo GVA)

# Demo build for the Conselleria: same app with the Generalitat Valenciana logo (gva.json).
# Published as a separate pre-release "demo-gva", never as "ultima".
on:
  push:
    branches: [claude/project-thread-0iv0wf]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: cp gva.ejemplo.json gva.json
      - run: npm run sync
      - name: Build APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk PautApp-demo-GVA.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PautApp-demo-GVA
          path: PautApp-demo-GVA.apk
      - name: Publish download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete demo-gva --yes --cleanup-tag || true
          gh release create demo-gva PautApp-demo-GVA.apk --prerelease --target "$GITHUB_SHA" --title "PautApp · demostració per a la Conselleria" --notes "Versió de demostració, amb el logotip de la Generalitat Valenciana. Obre aquest enllaç des del mòbil Android i toca PautApp-demo-GVA.apk per instal·lar-la. No és la versió pública."
